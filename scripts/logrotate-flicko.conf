# =============================================================================
# Flicko — Logrotate Configuration
# =============================================================================
#
# Manages log rotation for all Flicko production services:
#   - Docker container JSON logs (stdout/stderr captured by Docker)
#   - NGINX access and error logs
#   - Application-specific logs (fail2ban, Cloudflare updater, etc.)
#
# Installation:
#   sudo cp scripts/logrotate-flicko.conf /etc/logrotate.d/flicko
#   sudo logrotate --debug /etc/logrotate.d/flicko   # dry-run to verify
#
# Retention policy:
#   - 14 days for all logs (balances debugging needs with disk usage)
#   - Compressed with gzip after 1 day (delaycompress)
#   - Docker logs are also limited by daemon.json max-size/max-file
#
# Disk budget estimate (per service):
#   Active log:    ~50 MB/day (moderate traffic)
#   Compressed:    ~5 MB/day (10:1 gzip ratio)
#   14 days:       ~50 + (13 × 5) = ~115 MB per log file
#   Total (all):   ~500 MB - 1 GB
#
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Docker container logs
# ─────────────────────────────────────────────────────────────────────────────
# Docker writes container stdout/stderr to JSON log files under
# /var/lib/docker/containers/. While daemon.json limits individual file
# size (10MB × 5 files), logrotate provides an additional safety net
# and consistent retention policy across all log types.
#
# Note: Docker's built-in rotation (max-size/max-file in daemon.json)
# handles the primary rotation. This config catches edge cases and
# provides the 14-day retention guarantee.

/var/lib/docker/containers/*/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
    maxsize 100M
    su root root
}

# ─────────────────────────────────────────────────────────────────────────────
# NGINX logs
# ─────────────────────────────────────────────────────────────────────────────
# NGINX writes access.log and error.log. These are the primary source for:
#   - fail2ban jail matching (access.log for flicko-auth, error.log for rate limits)
#   - Traffic analysis and debugging
#   - Security audit trail
#
# We use 'postrotate' to send NGINX the USR1 signal, which tells it to
# reopen log files. This is the standard NGINX log rotation approach —
# safer than copytruncate because it prevents lost log lines during the
# brief window between truncation and NGINX noticing.
#
# If NGINX runs in Docker, the signal goes to the container's PID 1.

/var/log/nginx/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    sharedscripts
    create 0640 www-data adm
    postrotate
        # Signal NGINX to reopen log files.
        # Try host NGINX first, then containerised NGINX.
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 $(cat /var/run/nginx.pid) 2>/dev/null || true
        elif docker ps --filter "name=nginx" --format '{{.ID}}' | head -1 | xargs -r docker kill --signal=USR1 2>/dev/null; then
            true
        fi
    endscript
}

# ─────────────────────────────────────────────────────────────────────────────
# Flicko application logs
# ─────────────────────────────────────────────────────────────────────────────
# Application-level logs written outside Docker (deploy scripts, cron jobs,
# the Cloudflare IP updater, etc.).
#
# These are lower volume than Docker/NGINX logs but important for
# diagnosing deployment issues and security events.

/var/log/flicko-*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    create 0640 root adm
}

# ─────────────────────────────────────────────────────────────────────────────
# fail2ban logs
# ─────────────────────────────────────────────────────────────────────────────
# fail2ban's own log (ban/unban events, filter matches).
# Important for security audit and debugging jail misconfigurations.
# Note: fail2ban has its own logrotate config in most distros, but we
# include it here for consistent 14-day retention.

/var/log/fail2ban.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    create 0640 root adm
    postrotate
        # Tell fail2ban to reopen its log file.
        fail2ban-client flushlogs 2>/dev/null || true
    endscript
}
