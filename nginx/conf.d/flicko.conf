# =============================================================================
# Flicko — Server Block Configuration
# =============================================================================
#
# Defines the HTTP→HTTPS redirect and the main HTTPS virtual host with
# location blocks for every Flicko service endpoint.
#
# Included by nginx.conf via: include /etc/nginx/conf.d/*.conf;
# =============================================================================

# =============================================================================
# WebSocket Connection Upgrade Map
# =============================================================================
# Used by the Grafana location block to conditionally set the Connection
# header to "upgrade" only when an Upgrade header is present.
# Must be declared before any server block using $connection_upgrade.
# =============================================================================
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ''       close;
}


# =============================================================================
# HTTP → HTTPS Redirect (port 80)
# =============================================================================
# All real traffic arrives over HTTPS via Cloudflare. Port 80 only exists for:
#   1. Cloudflare health checks (CF hits :80 /health to verify origin is up)
#   2. Accidental plain-HTTP requests → 301 redirect to HTTPS
# =============================================================================
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  flicko.focko.tech;

    # Cloudflare and Docker health checks hit this on port 80.
    # No auth, no logging overhead — just a fast 200 probe.
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.20.1.0/24;
        deny all;
    }

    # Everything else → permanent redirect to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}


# =============================================================================
# Main HTTPS Server (port 443)
# =============================================================================
# Cloudflare handles public browser TLS. This server terminates the
# Cloudflare Origin Certificate (CF edge ↔ origin encryption in "Full (Strict)"
# mode). The cert is issued by Cloudflare's CA and is NOT publicly trusted —
# it only needs to be trusted by the CF edge.
# =============================================================================
server {
    listen       443 ssl default_server;
    listen       [::]:443 ssl default_server;
    # http2         on;  # Temporarily disabled to fix PROTOCOL_ERROR
    server_name  flicko.focko.tech;

    # ── SSL — Cloudflare Origin Certificate ─────────────────────────────────
    # Generated in Cloudflare Dashboard → SSL/TLS → Origin Server.
    # Mount path set in docker-compose.yml:
    #   ./nginx/ssl/origin.pem     → /etc/nginx/ssl/origin.pem
    #   ./nginx/ssl/origin-key.pem → /etc/nginx/ssl/origin-key.pem
    include /etc/nginx/conf.d/ssl.conf.inc;

    # ── Security Headers ────────────────────────────────────────────────────
    # Applied to every proxied response. The "always" flag ensures headers
    # are set even on error responses (4xx, 5xx).

    # Prevent clickjacking — no page may embed Flicko in an iframe.
    add_header X-Frame-Options "DENY" always;

    # Stop browsers from MIME-sniffing the Content-Type.
    add_header X-Content-Type-Options "nosniff" always;

    # Legacy XSS filter for older browsers. Modern browsers use CSP instead.
    add_header X-XSS-Protection "1; mode=block" always;

    # Control what the Referer header leaks on navigation.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy — lock down what the origin can load.
    #   default-src 'self'       → only same-origin resources
    #   connect-src              → allow WebSocket + API to our own domain
    #   img-src                  → allow same-origin + Cloudinary storage images + data URIs
    #   style-src 'unsafe-inline'→ needed for some inline SVG/styles
    #   frame-ancestors 'none'   → prevent embedding in iframes (HIGH-018)
    #   base-uri 'self'          → restrict <base> tag
    #   form-action 'self'       → restrict form submissions
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://flicko.focko.tech https://flicko.focko.tech https://res.cloudinary.com wss://*.livekit.cloud https://*.livekit.cloud; img-src 'self' data: https://res.cloudinary.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;

    # HTTP Strict Transport Security — force HTTPS for 1 year.
    # includeSubDomains covers *.flicko.focko.tech.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Disable browser features we don't need by default.
    # Camera and microphone are enabled for voice/video calls.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;

    # ── Connection Limit ────────────────────────────────────────────────────
    # Max 50 concurrent connections per real client IP.
    # Prevents a single IP from exhausting worker_connections.
    limit_conn  conn_limit  50;

    # ── Error Pages ─────────────────────────────────────────────────────────
    # Return JSON errors instead of NGINX's default HTML pages.
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @upstream_error;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"too many requests, slow down"}}';
    }

    location @upstream_error {
        default_type application/json;
        return 502 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"upstream service temporarily unavailable"}}';
    }


    # =========================================================================
    # LOCATION BLOCKS — ordered most-specific first
    # =========================================================================

    # ── Clerk Proxy Removed ──

    # ── WebSocket Gateway (/ws) ─────────────────────────────────────────────
    # Long-lived bidirectional connection. The client opens ONE WebSocket per
    # session and all real-time events flow through it (messages, typing,
    # presence, etc.).
    #
    # Rate limit is on the UPGRADE request only — once connected, the Go
    # gateway's internal rate limiter handles per-message throttling.
    location /ws {
        limit_req  zone=api_limit  burst=10  nodelay;

        proxy_pass          http://ws_gateway;
        proxy_http_version  1.1;

        # ── WebSocket upgrade ───────────────────────────────────────────────
        # These two headers trigger the HTTP → WebSocket protocol switch.
        # Without them NGINX treats it as a normal HTTP request and closes
        # the connection after the first response.
        proxy_set_header  Upgrade    $http_upgrade;
        proxy_set_header  Connection "upgrade";

        # ── Preserve client info ────────────────────────────────────────────
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;

        # ── WebSocket timeouts ──────────────────────────────────────────────
        # proxy_read_timeout = how long NGINX waits for a frame from upstream.
        # 3600 s (1 hour) keeps the connection alive through idle periods.
        # The Go gateway sends pings every 54 s (PingPeriod) which resets
        # this timer, so the connection only closes if the gateway truly dies.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # ── Disable buffering ───────────────────────────────────────────────
        # Real-time: frames must pass through immediately, not accumulate
        # in an NGINX buffer waiting for a buffer-full threshold.
        proxy_buffering  off;
        proxy_cache      off;

        # Slightly larger buffer for the initial HTTP upgrade handshake.
        proxy_buffer_size  8k;
    }

    # ── Auth Endpoints (/api/auth/) — stricter rate limit ───────────────────
    # Login, register, token refresh — prime brute-force targets.
    # 5 requests per MINUTE per IP with a tiny burst of 3.
    # This block MUST appear before the general /api/ block so NGINX
    # matches the more specific prefix first.
    location /api/auth/ {
        limit_req  zone=auth_limit  burst=3  nodelay;

        proxy_pass          http://msg_service/auth/;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";

        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     10s;
    }

    # ── Upload Presign Endpoint (/api/upload) ───────────────────────────────
    # The client POSTs a small JSON body ({filename, content_type, channel_id})
    # and receives a Cloudinary presigned upload URL. The actual file upload
    # goes directly to Cloudinary — NOT through this server.
    #
    # client_max_body_size 1k prevents abuse (uploading large payloads here).
    location /api/upload {
        limit_req  zone=upload_limit  burst=5  nodelay;

        # Only metadata, not the file itself.
        client_max_body_size  1k;

        proxy_pass          http://msg_service/upload;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";

        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     10s;
    }

    # ── REST API (/api/) — general ──────────────────────────────────────────
    # Messages, channels, guilds, members — all stateless CRUD.
    # The trailing slash in proxy_pass strips /api/ from the forwarded URI:
    #   /api/v1/channels/123/messages → /v1/channels/123/messages
    location /api/ {
        limit_req  zone=api_limit  burst=50  nodelay;

        # Strip internal-service headers that only trusted upstreams may set.
        # This prevents external clients from forging X-Flicko-Internal to
        # bypass JWT authentication on the msg-service.
        proxy_set_header  X-Flicko-Internal  "";
        proxy_set_header  X-Gateway-Token    "";

        proxy_pass          http://msg_service/;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;

        # Empty Connection header enables HTTP/1.1 keepalive to the upstream.
        # Without this, NGINX sends "Connection: close" and opens a new TCP
        # connection for every proxied request.
        proxy_set_header  Connection  "";

        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     10s;

        # Buffer API responses in memory before sending to the client.
        # Frees the upstream connection faster, improving throughput.
        proxy_buffering   on;
        proxy_buffer_size 4k;
        proxy_buffers     8 8k;
    }

    # ── Mail Gateway (/mail/) ───────────────────────────────────────────────
    # Receives Supabase Auth webhooks and sends emails via SMTP.
    # No rate limit on webhooks (Supabase already throttles).
    location /mail/ {
        proxy_pass          http://mail_gateway/;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  X-Supabase-Signature $http_x_supabase_signature;
        proxy_set_header  x-supabase-signature $http_x_supabase_signature;
        proxy_set_header  Connection        "";

        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     10s;
    }

    # ── Storage — Removed (/storage/) ──────────────────────────────────────
    # Storage is now Cloudinary (cloud). Clients upload/download directly
    # via B2 presigned URLs. No nginx proxy needed.

    # ── Grafana Dashboard (/grafana/) ───────────────────────────────────────
    # Admin-only monitoring UI. In production, restrict by IP.
    # Uncomment the allow/deny block and replace with your admin IP(s).
    location /grafana/ {
        # ── IP Whitelist (uncomment in production) ──────────────────────────
        # allow  YOUR.ADMIN.IP.HERE;
        # allow  10.0.0.0/8;           # VPN range (if applicable)
        # deny   all;

        proxy_pass          http://grafana_backend/;
        proxy_http_version  1.1;

        proxy_set_header  Host       $host;
        proxy_set_header  X-Real-IP  $remote_addr;

        # Grafana Live (WebSocket for dashboard auto-refresh).
        proxy_set_header  Upgrade    $http_upgrade;
        proxy_set_header  Connection $connection_upgrade;
    }

    # ── Health Check ────────────────────────────────────────────────────────
    # Used by Docker healthcheck and external uptime monitors.
    # No logging, no auth, no rate limit — must always respond.
    location /health {
        access_log  off;
        return 200  'ok';
        add_header  Content-Type text/plain;
    }

    # ── Catch-All — Welcome Message ─────────────────────────────────────────
    # Instead of dropping connections, show a friendly status message.
    location / {
        default_type application/json;
        return 200 '{"status":"online","message":"Welcome to Flicko API — The backend is humming!","docs":"https://docs.flicko.dev"}';
    }

    # ── Backend-only API routes ────────────────────────────────────────────────
    location = /api/v1/cloudinary/sign {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location ^~ /api/v1/commands {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location = /api/v1/users/@me/read_states {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location ~ ^/api/v1/channels/[^/]+/messages/[^/]+/read$ {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }
}



# Internal listener for nginx-exporter
server {
    listen 8080;
    server_name _;

    location /stub_status {
        stub_status;
        access_log off;
    }
}
