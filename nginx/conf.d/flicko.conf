# =============================================================================
# Flicko — Server Block Configuration
# =============================================================================
#
# Defines the HTTP→HTTPS redirect and the main HTTPS virtual host with
# location blocks for every Flicko service endpoint.
#
# Included by nginx.conf via: include /etc/nginx/conf.d/*.conf;
# =============================================================================

# =============================================================================
# WebSocket Connection Upgrade Map
# =============================================================================
# Used by the Grafana location block to conditionally set the Connection
# header to "upgrade" only when an Upgrade header is present.
# Must be declared before any server block using $connection_upgrade.
# =============================================================================
map $http_upgrade $connection_upgrade {
    default  close;
    ~*websocket upgrade;
}


# =============================================================================
# HTTP → HTTPS Redirect (port 80) — for livekit.flicko.dev only
# =============================================================================
# The main flicko.dev server block already handles port 80 (with health + 308).
# This block catches any other hostname hitting port 80 and redirects to HTTPS.
# =============================================================================
server {
    listen       80;
    listen       [::]:80;
    server_name  livekit.flicko.dev turn.flicko.dev;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 308 https://$host$request_uri;
    }
}


# =============================================================================
# Main HTTPS Server (port 443)
# =============================================================================
# Cloudflare handles public browser TLS. This server terminates the
# Cloudflare Origin Certificate (CF edge ↔ origin encryption in "Full (Strict)"
# mode). The cert is issued by Cloudflare's CA and is NOT publicly trusted —
# it only needs to be trusted by the CF edge.
# =============================================================================
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    listen       443 ssl default_server;
    listen       [::]:443 ssl default_server;
    # http2         on;  # Temporarily disabled to fix PROTOCOL_ERROR
    server_name  flicko.dev www.flicko.dev flicko.southeastasia.cloudapp.azure.com;

    # ── SSL — Cloudflare Origin Certificate ─────────────────────────────────
    # Generated in Cloudflare Dashboard → SSL/TLS → Origin Server.
    # Mount path set in docker-compose.yml:
    #   ./nginx/ssl/origin.pem     → /etc/nginx/ssl/origin.pem
    #   ./nginx/ssl/origin-key.pem → /etc/nginx/ssl/origin-key.pem
    include /etc/nginx/conf.d/ssl.conf.inc;

    # ── Security Headers ────────────────────────────────────────────────────
    # Applied to every proxied response. The "always" flag ensures headers
    # are set even on error responses (4xx, 5xx).

    # Prevent clickjacking — no page may embed Flicko in an iframe.
    add_header X-Frame-Options "DENY" always;

    # Stop browsers from MIME-sniffing the Content-Type.
    add_header X-Content-Type-Options "nosniff" always;

    # Legacy XSS filter for older browsers. Modern browsers use CSP instead.
    add_header X-XSS-Protection "1; mode=block" always;

    # Control what the Referer header leaks on navigation.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy — lock down what the origin can load.
    #   default-src 'self'       → only same-origin resources
    #   connect-src              → allow WebSocket + API to our own domain
    #   img-src                  → allow same-origin + Azure Blob Storage + Appwrite + data URIs
    #   style-src 'unsafe-inline'→ needed for some inline SVG/styles
    #   frame-ancestors 'none'   → prevent embedding in iframes (HIGH-018)
    #   base-uri 'self'          → restrict <base> tag
    #   form-action 'self'       → restrict form submissions
    #
    # livekit.flicko.dev must be listed explicitly: 'self' does not cover
    # subdomains and CSP ignores HSTS's includeSubDomains, so the LiveKit
    # signaling WebSocket was blocked outright in the browser.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://flicko.dev https://flicko.dev wss://livekit.flicko.dev https://livekit.flicko.dev https://*.blob.core.windows.net https://cloud.appwrite.io https://*.appwrite.io; img-src 'self' data: https://*.blob.core.windows.net https://cloud.appwrite.io https://*.appwrite.io; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;

    # HTTP Strict Transport Security — force HTTPS for 1 year.
    # includeSubDomains covers *.flicko.dev.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Disable browser features we don't need by default.
    # Camera and microphone are enabled for voice/video calls.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;

    # ── Connection Limit ────────────────────────────────────────────────────
    # Max 50 concurrent connections per real client IP.
    # Prevents a single IP from exhausting worker_connections.
    limit_conn  conn_limit  50;

    # ── Error Pages ─────────────────────────────────────────────────────────
    # Return JSON errors instead of NGINX's default HTML pages.
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @upstream_error;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"too many requests, slow down"}}';
    }

    location @upstream_error {
        default_type application/json;
        return 502 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"upstream service temporarily unavailable"}}';
    }


    # =========================================================================
    # LOCATION BLOCKS — ordered most-specific first
    # =========================================================================

    # ── Clerk Proxy Removed ──

    # ── WebSocket Gateway (/ws) ─────────────────────────────────────────────
    # Long-lived bidirectional connection. The client opens ONE WebSocket per
    # session and all real-time events flow through it (messages, typing,
    # presence, etc.).
    #
    # Rate limit is on the UPGRADE request only — once connected, the Go
    # gateway's internal rate limiter handles per-message throttling.
    location /ws {
        limit_req  zone=api_limit  burst=10  nodelay;

        proxy_pass          http://ws_gateway;
        proxy_http_version  1.1;

        # ── WebSocket upgrade ───────────────────────────────────────────────
        # These two headers trigger the HTTP → WebSocket protocol switch.
        # Without them NGINX treats it as a normal HTTP request and closes
        # the connection after the first response.
        proxy_set_header  Upgrade    $http_upgrade;
        proxy_set_header  Connection $connection_upgrade;

        # ── Preserve client info ────────────────────────────────────────────
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;

        # ── WebSocket timeouts ──────────────────────────────────────────────
        # proxy_read_timeout = how long NGINX waits for a frame from upstream.
        # 3600 s (1 hour) keeps the connection alive through idle periods.
        # The Go gateway sends pings every 54 s (PingPeriod) which resets
        # this timer, so the connection only closes if the gateway truly dies.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # ── Disable buffering ───────────────────────────────────────────────
        # Real-time: frames must pass through immediately, not accumulate
        # in an NGINX buffer waiting for a buffer-full threshold.
        proxy_buffering  off;
        proxy_cache      off;

        # Slightly larger buffer for the initial HTTP upgrade handshake.
        proxy_buffer_size  8k;
    }

    # ── Auth Endpoints (/api/auth/) — stricter rate limit ───────────────────
    # Login, register, token refresh — prime brute-force targets.
    # 5 requests per MINUTE per IP with a tiny burst of 3.
    # This block MUST appear before the general /api/ block so NGINX
    # matches the more specific prefix first.
    location /api/auth/ {
        limit_req  zone=auth_limit  burst=3  nodelay;

        proxy_pass          http://msg_service/auth/;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";

        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     10s;
    }

    # ── Upload Presign Endpoint (/api/upload) ───────────────────────────────
    # The client POSTs a small JSON body ({filename, content_type, channel_id})
    # and receives a Cloudinary presigned upload URL. The actual file upload
    # goes directly to Cloudinary — NOT through this server.
    #
    # client_max_body_size 1k prevents abuse (uploading large payloads here).
    location /api/upload {
        limit_req  zone=upload_limit  burst=5  nodelay;

        # Only metadata, not the file itself.
        client_max_body_size  1k;

        proxy_pass          http://msg_service/upload;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";

        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     10s;
    }

    # ── REST API (/api/) — general ──────────────────────────────────────────
    # Messages, channels, guilds, members — all stateless CRUD.
    # The trailing slash in proxy_pass strips /api/ from the forwarded URI:
    #   /api/v1/channels/123/messages → /v1/channels/123/messages
    location /api/ {
        limit_req  zone=api_limit  burst=50  nodelay;

        # Strip internal-service headers that only trusted upstreams may set.
        # This prevents external clients from forging X-Flicko-Internal to
        # bypass JWT authentication on the msg-service.
        proxy_set_header  X-Flicko-Internal  "";
        proxy_set_header  X-Gateway-Token    "";

        proxy_pass          http://msg_service/;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;

        # Empty Connection header enables HTTP/1.1 keepalive to the upstream.
        # Without this, NGINX sends "Connection: close" and opens a new TCP
        # connection for every proxied request.
        proxy_set_header  Connection  "";

        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     10s;

        # Buffer API responses in memory before sending to the client.
        # Frees the upstream connection faster, improving throughput.
        proxy_buffering   on;
        proxy_buffer_size 4k;
        proxy_buffers     8 8k;
    }

    # ── Direct REST API (/v1/) ──────────────────────────────────────────────
    # Backwards compatibility and direct client endpoints.
    # Since there is no trailing slash in proxy_pass, the original URI
    # (including /v1/) is passed directly to the upstream msg_service.
    location /v1/ {
        limit_req  zone=api_limit  burst=50  nodelay;

        # Strip internal-service headers that only trusted upstreams may set.
        proxy_set_header  X-Flicko-Internal  "";
        proxy_set_header  X-Gateway-Token    "";

        proxy_pass          http://msg_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";

        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     10s;

        # Buffer API responses in memory before sending to the client.
        proxy_buffering   on;
        proxy_buffer_size 4k;
        proxy_buffers     8 8k;
    }

    # ── Mail Gateway (/mail/) ───────────────────────────────────────────────
    # Receives Auth webhooks and sends emails via SMTP / Azure.
    location /mail/ {
        proxy_pass          http://mail_gateway/;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";

        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     10s;
    }

    # ── Storage ─────────────────────────────────────────────────────────────
    # Storage uses Azure Blob Storage and Appwrite (cloud). Clients upload/download
    # directly via presigned URLs. No local nginx proxy needed.

    # ── Grafana Dashboard (/grafana/) ───────────────────────────────────────
    # Admin-only monitoring UI. In production, restrict by IP.
    # Uncomment the allow/deny block and replace with your admin IP(s).
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        # ── IP Whitelist (uncomment in production) ──────────────────────────
        # allow  YOUR.ADMIN.IP.HERE;
        # allow  10.0.0.0/8;           # VPN range (if applicable)
        # deny   all;

        proxy_pass          http://grafana_backend;
        proxy_http_version  1.1;

        proxy_set_header  Host       $host;
        proxy_set_header  X-Real-IP  $remote_addr;

        # Grafana Live (WebSocket for dashboard auto-refresh).
        proxy_set_header  Upgrade    $http_upgrade;
        proxy_set_header  Connection $connection_upgrade;

        # Override global server CSP so Grafana Webpack bundles and subpath routing work without browser blocking
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline';" always;
    }

    # ── Health Check ────────────────────────────────────────────────────────
    # Used by Docker healthcheck and external uptime monitors.
    # No logging, no auth, no rate limit — must always respond.
    location /health {
        access_log    off;
        default_type  text/plain;
        return 200    'ok';
    }

    # ── Open App Redirect (/open) ───────────────────────────────────────────
    # Redirects mobile devices to the native application via custom URI scheme.
    location = /open {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Redirecting to Flicko...</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body { background-color: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 20px; } .btn { display: inline-block; background-color: #52B788; color: #000000 !important; text-decoration: none; font-weight: 900; font-size: 16px; padding: 18px 40px; text-transform: uppercase; letter-spacing: 1.5px; border: 3px solid #000000; box-shadow: 4px 4px 0 #ffffff; margin-top: 20px; cursor: pointer; }</style><script>window.onload = function() { window.location.href = "io.flicko.app://login-callback/"; };</script></head><body><h2>LAUNCHING FLICKO</h2><p>We are opening the Flicko mobile app on your device...</p><a href="io.flicko.app://login-callback/" class="btn">ENTER FLICKO APP</a></body></html>';
    }

    # ── Catch-All — Welcome Message ─────────────────────────────────────────
    # Serve a beautiful API Status and Developer landing page.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }


    # ── Backend-only API routes ────────────────────────────────────────────────

    location ^~ /api/v1/commands {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location ^~ /api/v1/e2ee {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location ^~ /api/v1/users/@me {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location ^~ /api/v1/ai {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location ~ ^/api/v1/channels/[^/]+/messages/[^/]+/read$ {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location ^~ /api/v1/servers {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location ^~ /api/v1/messages/notify {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location ^~ /api/v1/reactions {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location ^~ /api/v1/premium {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    location = /api/v1/polls/vote {
        limit_req  zone=api_limit  burst=20  nodelay;

        proxy_pass          http://backend_service;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }

    # ── Tolgee Self-Hosted Translation Platform ──────────────────────────────
    location /tolgee/ {
        proxy_pass          http://tolgee_service/;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Request-ID      $request_id;
        proxy_set_header  Connection        "";
    }
}



# =============================================================================
# LiveKit Signaling Server (livekit.flicko.dev)
# =============================================================================
# Reverse-proxies WebSocket signaling traffic to the self-hosted LiveKit SFU
# running on localhost:7880 (host network mode).
#
# Cloudflare should proxy this subdomain (orange cloud ON) so the origin
# certificate is trusted. WebRTC media flows over UDP directly to the server
# IP (ports 50000–60000), not through Cloudflare.
# =============================================================================
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    server_name  livekit.flicko.dev;

    include /etc/nginx/conf.d/ssl.conf.inc;

    # LiveKit signaling is pure WebSocket — proxy to the SFU.
    location / {
        proxy_pass          http://10.0.0.4:7880;
        proxy_http_version  1.1;

        proxy_set_header  Upgrade    $http_upgrade;
        proxy_set_header  Connection $connection_upgrade;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;

        # LiveKit signaling connections are long-lived WebSockets.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_cache         off;
    }

    # LiveKit webhook receiver (from LiveKit SFU to msg-service).
    location /webhook {
        proxy_pass          http://flicko-msg-service:8081/v1/voice/webhook;
        proxy_http_version  1.1;

        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  Connection        "";
    }
}


# Internal listener for nginx-exporter
server {
    listen 8080;
    server_name _;

    location /stub_status {
        stub_status;
        access_log off;
    }
}
