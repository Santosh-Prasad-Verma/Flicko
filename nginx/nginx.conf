# =============================================================================
# Flicko — Main NGINX Configuration
# =============================================================================
#
# Runs inside Docker (nginx:1.25-alpine), reverse-proxies to Go services.
# Cloudflare sits in front handling public TLS + DDoS + WAF.
# NGINX terminates a Cloudflare Origin Certificate (CF ↔ origin encryption).
#
# Container resource limit: 128 MB RAM, 0.25 CPU (see docker-compose.yml).
# Target: 3k–5k CCU on a single 8 GB VPS.
# =============================================================================

user  nginx;

# One worker per CPU core. On a 0.25 CPU container this maps to 1 worker,
# but auto means we adapt automatically if the container gets more cores.
worker_processes  auto;

# Raise the per-worker file descriptor ceiling so we can hold thousands of
# concurrent WebSocket connections. Each connection needs ≥2 fds
# (client + upstream). Kernel must also be tuned (fs.file-max ≥ 200000).
worker_rlimit_nofile  65536;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# -----------------------------------------------------------------------------
# Events — connection handling tuning
# -----------------------------------------------------------------------------
events {
    # Maximum simultaneous connections per worker.
    # With 4 workers × 16384 = 65536 theoretical max (capped by rlimit above).
    worker_connections  16384;

    # Accept all pending connections at once instead of one-at-a-time.
    multi_accept  on;

    # Linux epoll is O(1) for ready-fd lookup — mandatory for high concurrency.
    use  epoll;
}

# -----------------------------------------------------------------------------
# HTTP — global settings, rate limits, upstreams
# -----------------------------------------------------------------------------
http {

    # ── Basic Settings ──────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Zero-copy file sends (kernel → socket without user-space copy).
    sendfile     on;

    # Batch TCP writes: accumulate a full MSS before sending (works with sendfile).
    tcp_nopush   on;

    # Disable Nagle's algorithm — send small frames immediately.
    # Critical for low-latency WebSocket and API responses.
    tcp_nodelay  on;

    # How long to keep an idle keepalive connection to the client open.
    keepalive_timeout   65;

    # After 1000 requests on a single keepalive connection, force reconnect
    # to redistribute load across workers.
    keepalive_requests  1000;

    types_hash_max_size  2048;

    # Hide the NGINX version from Server header and error pages.
    # Prevents attackers from targeting version-specific vulnerabilities.
    server_tokens  off;

    # ── Structured JSON Access Log ──────────────────────────────────────────
    # Ingestible by Loki / Promtail / Grafana without regex parsing.
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"ws_upgrade":"$http_upgrade",'
            '"request_id":"$request_id"'
        '}';

    # Buffer 32 KB of log lines, flush every 5 s — reduces disk I/O under load.
    access_log  /var/log/nginx/access.log  json_combined  buffer=32k flush=5s;

    # ── Buffer & Timeout Tuning ─────────────────────────────────────────────
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    # Global max upload size. Per-location overrides can tighten it further.
    client_max_body_size  25m;

    # Slowloris protection: drop connections that trickle data byte-by-byte.
    # 10 s is generous for a mobile app posting JSON, yet tight enough to
    # free sockets held open by slow attackers.
    client_body_timeout    10s;
    client_header_timeout  10s;
    send_timeout           10s;

    # ── Rate Limiting Zones ─────────────────────────────────────────────────
    # All keyed on $binary_remote_addr (16 bytes/entry). 10 MB zone ≈ 160 k IPs.
    #
    # These are NGINX Layer-1 limits (per-IP). The Go application enforces
    # per-user limits via Redis (Layer 2). Cloudflare provides Layer 0.

    # General API: 30 requests/s per IP — covers normal app traffic.
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m     rate=30r/s;

    # WebSocket upgrades: 5/s per IP — one connection attempt per 200 ms.
    limit_req_zone  $binary_remote_addr  zone=ws_limit:10m      rate=5r/s;

    # Upload presign requests: 2/s per IP — metadata only, actual uploads
    # go directly to Cloudinary via presigned URL.
    limit_req_zone  $binary_remote_addr  zone=upload_limit:10m  rate=2r/s;

    # Auth endpoints (login, register, refresh): 5 per minute per IP.
    # Tightest limit — brute-force protection.
    limit_req_zone  $binary_remote_addr  zone=auth_limit:10m    rate=5r/m;

    # Per-IP connection limit zone. Actual limit set in server block.
    limit_conn_zone  $binary_remote_addr  zone=conn_limit:10m;

    # Return 429 (not default 503) when rate/conn limits fire.
    limit_req_status   429;
    limit_conn_status  429;

    # ── Gzip ────────────────────────────────────────────────────────────────
    # Compress JSON API responses and text. Level 4 is a good speed/ratio
    # trade-off. Images and binaries are already compressed — not listed.
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  4;
    gzip_min_length  256;
    gzip_types
        text/plain
        application/json
        application/javascript
        text/css
        application/xml
        text/xml
        application/x-javascript
        text/javascript;

    # ── Upstream Definitions ────────────────────────────────────────────────
    # Docker-internal hostnames resolved by Docker's embedded DNS (127.0.0.11).

    upstream ws_gateway {
        # ip_hash ensures a client always hits the same gateway instance,
        # which matters when we scale to N gateway replicas (each holds
        # stateful WebSocket connections for different user sets).
        ip_hash;
        server ws-gateway:8080;
        # Future horizontal scaling:
        # server ws-gateway-2:8080;
        # server ws-gateway-3:8080;

        # Keep 64 idle TCP connections to the gateway alive — avoids the
        # overhead of TCP+TLS handshake per WebSocket upgrade.
        keepalive 64;
    }

    upstream msg_service {
        # Least-connections for stateless REST API — distributes evenly
        # even when request durations vary (e.g., paginated vs single-row).
        least_conn;
        server msg-service:8081;
        # Future horizontal scaling:
        # server msg-service-2:8081;

        keepalive 32;
    }

    # Storage is now Cloudinary (cloud) — no local upstream needed.
    # Clients upload/download directly via Cloudinary presigned URLs.

    upstream grafana_backend {
        server grafana:3000;
    }

    # ── Cloudflare Real IP Restoration ──────────────────────────────────────
    # When Cloudflare proxies a request, $remote_addr is a CF edge IP.
    # We need the real client IP for rate limiting, logging, and abuse
    # detection. CF publishes its IP ranges at:
    #   https://www.cloudflare.com/ips-v4/
    #   https://www.cloudflare.com/ips-v6/
    #
    # These ranges should be refreshed periodically (cron + cf-ip-update).

    # IPv4
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  131.0.72.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;

    # IPv6
    set_real_ip_from  2400:cb00::/32;
    set_real_ip_from  2606:4700::/32;
    set_real_ip_from  2803:f800::/32;
    set_real_ip_from  2405:b500::/32;
    set_real_ip_from  2405:8100::/32;
    set_real_ip_from  2c0f:f248::/32;
    set_real_ip_from  2a06:98c0::/29;

    # Use the CF-Connecting-IP header (set by Cloudflare) as the real IP.
    # This replaces $remote_addr, making rate limit zones and logs accurate.
    real_ip_header  CF-Connecting-IP;

    # ── Include server blocks ───────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
