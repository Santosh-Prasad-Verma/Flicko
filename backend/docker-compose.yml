# docker-compose.yml
version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8090:8080"
      - "8091:8081"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://flicko:${POSTGRES_PASSWORD:-changeme}@db:5432/flickodb?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:?set_JWT_SECRET}
      - PORT_HTTP=8080
      - PORT_WS=8081
      - SUPABASE_URL=${SUPABASE_URL:?set_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?set_SUPABASE_SERVICE_ROLE_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-demo}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-demo}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-demo}
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flicko-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=flicko
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=flickodb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:z
    networks:
      - flicko-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U flicko -d flickodb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — now hosted on Upstash (cloud). No local container needed.
  # Set REDIS_URL in your .env to point to your Upstash instance.

volumes:
  postgres_data:


networks:
  flicko-network:
    driver: bridge
