# docker-compose.yml
version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8090:8080"
      - "8091:8081"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://flicko:${POSTGRES_PASSWORD:-changeme}@db:5432/flickodb?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:?set_JWT_SECRET}
      - PORT_HTTP=8080
      - PORT_WS=8081
      - SUPABASE_URL=${SUPABASE_URL:?set_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?set_SUPABASE_SERVICE_ROLE_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - ENVIRONMENT=development
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flicko-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=flicko
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=flickodb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:z
    networks:
      - flicko-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U flicko -d flickodb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flicko-redis-backend
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flicko-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:


networks:
  flicko-network:
    driver: bridge
