# =============================================================================
# Flicko — fail2ban filter for failed API authentication attempts
# =============================================================================
#
# Jail:   flicko-auth (defined in /etc/fail2ban/jail.local)
# Log:    /var/log/nginx/access.log (NGINX combined format)
# Action: Ban client IP via UFW after repeated 401 responses
#
# What this filter catches:
#   - Brute-force login attempts (POST /api/auth/login returning 401)
#   - Invalid/expired JWT token usage (any /api/auth/* returning 401)
#   - Credential stuffing attacks against auth endpoints
#   - Automated token guessing / enumeration
#
# What this filter does NOT catch (by design):
#   - Successful authentications (200/201 responses)
#   - Rate-limited requests (429 — handled by nginx-limit-req jail)
#   - Server errors (500 — not the client's fault)
#   - Non-auth endpoints (handled at the application layer)
#
# NGINX log format expected (combined):
#   172.64.100.1 - - [28/Feb/2026:12:00:00 +0000] "POST /api/auth/login HTTP/1.1" 401 38 "-" "Mozilla/5.0..."
#
# When Cloudflare is in front of NGINX:
#   The client IP in NGINX logs is Cloudflare's IP unless you configure
#   NGINX to use the CF-Connecting-IP or X-Forwarded-For header.
#   Ensure your NGINX config includes:
#
#     set_real_ip_from 173.245.48.0/20;  # (all CF ranges)
#     real_ip_header CF-Connecting-IP;
#
#   Without this, fail2ban will ban Cloudflare IPs instead of the
#   actual attacker — which would block ALL traffic through that
#   Cloudflare edge node.
#
# Installation:
#   sudo cp fail2ban/filter.d/flicko-auth.conf /etc/fail2ban/filter.d/
#   sudo fail2ban-client reload
#   sudo fail2ban-client status flicko-auth
#
# Testing the filter:
#   fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/flicko-auth.conf
#
# =============================================================================

[Definition]

# ── Fail regex ───────────────────────────────────────────────────────────────
#
# Matches NGINX combined log lines where:
#   1. The request targets any /api/auth/ endpoint (login, register,
#      refresh, verify, etc.)
#   2. The HTTP response status is 401 (Unauthorized)
#
# The <HOST> tag is a fail2ban macro that expands to the regex for
# matching an IP address (both IPv4 and IPv6).
#
# Regex breakdown:
#   ^<HOST>          — Client IP at the start of the line
#   \s+-\s+-\s+      — Identity and auth fields (usually "- -")
#   \[.+?\]          — Timestamp in brackets
#   \s+"             — Space + opening quote
#   (GET|POST|PUT|PATCH|DELETE)  — HTTP method
#   \s+/api/auth/    — The auth endpoint path prefix
#   \S*              — Rest of the URI path + query string
#   \s+HTTP/\S+"     — HTTP version + closing quote
#   \s+401           — The 401 status code
#
# Examples that WILL match:
#   172.64.100.1 - - [28/Feb/2026:12:00:00 +0000] "POST /api/auth/login HTTP/1.1" 401 38 "-" "curl/7.68"
#   10.0.0.1 - - [28/Feb/2026:12:00:01 +0000] "GET /api/auth/verify HTTP/2.0" 401 0 "-" "Mozilla/5.0"
#   2606:4700::1 - - [28/Feb/2026:12:00:02 +0000] "POST /api/auth/refresh HTTP/1.1" 401 52 "-" "axios/0.21"
#
# Examples that will NOT match:
#   172.64.100.1 - - [...] "POST /api/auth/login HTTP/1.1" 200 1234 ...    (success)
#   172.64.100.1 - - [...] "POST /api/messages HTTP/1.1" 401 38 ...        (not auth endpoint)
#   172.64.100.1 - - [...] "GET /api/auth/login HTTP/1.1" 429 0 ...        (rate limited, not 401)

failregex = ^<HOST> \S+ \S+ \[.+?\] "(GET|POST|PUT|PATCH|DELETE) /api/auth/\S* HTTP/\S+" 401

# ── Ignore regex ─────────────────────────────────────────────────────────────
#
# Exclude health check endpoints and monitoring probes that might
# occasionally hit auth endpoints during synthetic testing.

ignoreregex = ^<HOST> .+ "(GET|POST) /healthz
              ^<HOST> .+ "(GET|POST) /api/health
