# ==============================================================================
# Flicko CI/CD Pipeline - Azure DevOps
# 
# Stages:
#  1. Test & Lint  - Go tests (-race, -short), go vet, and dependency check
#  2. Build & Push - Build backend Docker image & push to Container Registry
#  3. Continuous Deployment (CD) - Deploy container to VPS / Cloud Server
# ==============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - services/**
      - docker-compose.prod.yml
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - services/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Tag strategy: Build ID and latest
  tag: '$(Build.BuildId)'
  gitCommitSha: '$(Build.SourceVersion)'
  imageRepository: 'flicko-backend'
  # Name of your Docker Registry Service Connection in Azure DevOps (Project Settings -> Service Connections)
  # Optional: change this if you configured ACR / DockerHub service connection
  dockerRegistryServiceConnection: 'FlickoContainerRegistry'
  # Optional: Variable group name in Pipelines -> Library (if using secrets)
  # - group: Flicko-Deploy-Secrets

stages:
  # ============================================================================
  # Stage 1: Automated Testing & Linting
  # ============================================================================
  - stage: TestAndLint
    displayName: '1. Test & Lint Go Code'
    jobs:
      - job: TestBackend
        displayName: 'Backend Go Tests & Vet'
        steps:
          - task: GoTool@0
            inputs:
              version: '1.24'
            displayName: 'Set up Go 1.24'

          - script: |
              set -euo pipefail
              echo "=== Verifying Go Modules ==="
              cd backend
              go mod verify

              echo "=== Running Go Vet ==="
              go vet ./...

              echo "=== Running Go Unit Tests ==="
              go test -short -v -race ./...
            displayName: 'Execute Go Vet & Tests'

      - job: TestServices
        displayName: 'Microservices Tests'
        steps:
          - task: GoTool@0
            inputs:
              version: '1.24'
            displayName: 'Set up Go 1.24'

          - script: |
              set -euo pipefail
              if [ -d "services/ws-gateway" ]; then
                echo "=== Testing WS Gateway ==="
                cd services/ws-gateway
                go test -short -v ./...
              fi
            displayName: 'Execute Microservices Tests'

  # ============================================================================
  # Stage 2: Build and Push Docker Image
  # ============================================================================
  - stage: BuildAndPush
    displayName: '2. Build & Push Container Image'
    dependsOn: TestAndLint
    condition: succeeded()
    jobs:
      - job: BuildAndPushImage
        displayName: 'Build and Push Docker Image'
        steps:
          - checkout: self

          # If Docker Registry Service Connection is configured, build and push
          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: 'build'
              dockerfile: '$(Build.SourcesDirectory)/backend/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/backend'
              repository: '$(imageRepository)'
              tags: |
                $(tag)
                latest

          # Push step (Enabled if service connection is set up)
          # Uncomment or enable this step when you create the service connection in Azure DevOps
          # - task: Docker@2
          #   displayName: 'Push Image to Container Registry'
          #   inputs:
          #     command: 'push'
          #     containerRegistry: '$(dockerRegistryServiceConnection)'
          #     repository: '$(imageRepository)'
          #     tags: |
          #       $(tag)
          #       latest

  # ============================================================================
  # Stage 3: Continuous Deployment (CD) to VPS / Cloud Server
  # ============================================================================
  - stage: Deploy
    displayName: '3. Deploy to Server (CD)'
    dependsOn: BuildAndPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToVPS
        displayName: 'Deploy Container to VPS'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "=== Continuous Deployment Triggered for Flicko Backend ==="
                    echo "Build ID: $(Build.BuildId)"
                    echo "Commit: $(Build.SourceVersion)"
                    echo "Deployment environment: Production"
                  displayName: 'Deploy Status Notification'

                # Option A: SSH Deployment to VPS (Requires SSH Service Connection 'FlickoVPSSSH')
                # - task: SSH@0
                #   displayName: 'Deploy to VPS via SSH'
                #   inputs:
                #     sshEndpoint: 'FlickoVPSSSH'
                #     runOptions: 'inline'
                #     inline: |
