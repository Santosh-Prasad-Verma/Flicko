# ==============================================================================
# Flicko CI/CD Pipeline - Azure DevOps
# 
# Stages:
#  1. Test & Lint  - Go tests (-race, -short), go vet, and dependency check
#  2. Build & Push - Build backend Docker image & push to Container Registry
#  3. Continuous Deployment (CD) - Deploy container to VPS / Cloud Server
# ==============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - services/**
      - docker-compose.prod.yml
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - services/**

variables:
  tag: '$(Build.BuildId)'
  imageRepository: 'flicko-backend'
  # Name of your Docker Registry Service Connection in Azure DevOps
  dockerRegistryServiceConnection: 'FlickoContainerRegistry'

stages:
  # ============================================================================
  # Stage 1: Automated Testing & Linting
  # ============================================================================
  - stage: TestAndLint
    displayName: '1. Test & Lint Go Code'
    jobs:
      - job: TestBackend
        displayName: 'Backend Go Tests & Vet'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              set -euo pipefail
              echo "=== Go Environment ==="
              go version

              echo "=== Verifying Go Modules ==="
              cd backend
              go mod verify

              echo "=== Running Go Vet ==="
              go vet ./...

              echo "=== Running Go Unit Tests ==="
              go test -short -v -race ./...
            displayName: 'Execute Go Vet & Tests'

      - job: TestServices
        displayName: 'Microservices Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              set -euo pipefail
              if [ -d "services/ws-gateway" ]; then
                echo "=== Testing WS Gateway ==="
                cd services/ws-gateway
                go test -short -v ./...
              fi
            displayName: 'Execute Microservices Tests'

  # ============================================================================
  # Stage 2: Build Docker Image
  # ============================================================================
  - stage: BuildAndPush
    displayName: '2. Build Container Image'
    dependsOn: TestAndLint
    condition: succeeded()
    jobs:
      - job: BuildImage
        displayName: 'Build Docker Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: 'build'
              dockerfile: '$(Build.SourcesDirectory)/backend/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/backend'
              repository: '$(imageRepository)'
              tags: |
                $(tag)
                latest

  # ============================================================================
  # Stage 3: Continuous Deployment (CD)
  # ============================================================================
  - stage: Deploy
    displayName: '3. Deploy to Server (CD)'
    dependsOn: BuildAndPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployNotification
        displayName: 'Deploy Container Status'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "=== Continuous Deployment Triggered for Flicko Backend ==="
              echo "Build ID: $(Build.BuildId)"
              echo "Commit: $(Build.SourceVersion)"
              echo "Branch: $(Build.SourceBranch)"
              echo "All tests passed and Docker image built successfully!"
            displayName: 'Deployment Notification'
