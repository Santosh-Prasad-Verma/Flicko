version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: flicko-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:latest
    container_name: flicko-livekit-sfu
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis
    environment:
      - REDIS_ADDRESS=redis:6379
