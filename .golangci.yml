run:
  timeout: 5m

issues:
  exclude-dirs:
    - scripts
  exclude-rules:
    - text: "Error return value of .* is not checked"
      linters:
        - errcheck
    - text: "Error return value is not checked"
      linters:
        - errcheck
    - text: "ineffectual assignment to"
      linters:
        - ineffassign
    - text: "empty branch"
      linters:
        - staticcheck
    - path: _test\.go
      linters:
        - errcheck
        - staticcheck
