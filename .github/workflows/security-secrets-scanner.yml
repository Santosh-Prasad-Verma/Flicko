name: Security - Secrets Scanner

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  gitleaks:
    name: GitLeaks Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetch all history so GitLeaks can scan commit history back to the merge base
          fetch-depth: 0

      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          # GitLeaks Action will run out-of-the-box.
          # Note: If running on a private repository, you can configure GITLEAKS_LICENSE
          # if required by the enterprise license, otherwise it scans free of cost.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
