name: Zscaler IaC Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 11 * * 3'

permissions:
  contents: read

jobs:
  zscaler-iac-scan:
    name: Zscaler IaC Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Zscaler IAC Scan
        uses: ZscalerCWP/Zscaler-IaC-Action@df1ce913b51df9f5e42eca910f0b6b5e8ad61945
        id: zscaler-iac-scan
        continue-on-error: true
        with:
          client_id: ${{ secrets.ZSCANNER_CLIENT_ID }}
          client_secret: ${{ secrets.ZSCANNER_CLIENT_SECRET }}
          region: 'US'
          iac_dir: '.'
          output_format: 'sarif'
          fail_build: 'false'

      - name: Upload SARIF file
        if: ${{ always() && steps.zscaler-iac-scan.outputs.sarif_file_path != '' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        continue-on-error: true
        with:
          sarif_file: ${{ steps.zscaler-iac-scan.outputs.sarif_file_path }}
