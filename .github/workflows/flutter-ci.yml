name: Flutter CI

on:
  push:
    branches: ['main']
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: read

jobs:
  flutter-checks:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create Mock Env File
        run: touch .env

      - name: Set up Java
        # Required for building Android components/runners if needed in widget testing
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install Dependencies
        run: flutter pub get

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsqlite3-dev sqlite3

      - name: Static Analysis
        # Verifies static compilation, syntax correctness, and import health
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Tests
        # Executes all unit and widget tests with retry for transient native asset downloads
        run: |
          for i in 1 2 3; do
            if flutter test; then
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "flutter test failed, retrying in 5 seconds (attempt $i/3)..."
              sleep 5
            else
              echo "flutter test failed after 3 attempts."
              exit 1
            fi
          done
