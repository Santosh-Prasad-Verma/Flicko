name: Mobile E2E (Patrol on Android Emulator)

# On-device E2E via an Android EMULATOR booted inside the GitHub-hosted runner.
# No device farm, no GCP, no cloud account — the emulated phone talks to your
# Azure-hosted backend over the network like any real device would.
#
# Heavier than the unit/widget suite, so it is NOT a per-PR gate: it runs on
# merge to main and on-demand. flutter-ci.yml stays the fast per-PR gate.
on:
  # NOT a per-PR gate: the emulator job is heavy (~10-15 min) and E2E tests
  # write real rows, so it runs only on merge to main and on-demand.
  push:
    branches: ['main']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-e2e.yml'
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level to emulate'
        required: true
        default: '30'  # Android 11

jobs:
  patrol-e2e:
    name: Patrol E2E on Android Emulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Enable KVM hardware acceleration
        # The emulator needs KVM to run at usable speed on the runner.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create dummy .env for asset bundling
        run: touch .env

      - name: Materialize google-services.json
        # android/app/build.gradle.kts applies com.google.gms.google-services,
        # and that plugin FAILS THE BUILD outright when google-services.json is
        # absent (":app:processDebugGoogleServices > File google-services.json is
        # missing"). The real file is gitignored (it carries a Firebase API key),
        # so a fresh CI checkout never has one and the Patrol build dies before a
        # single test runs.
        #
        # If ANDROID_GOOGLE_SERVICES_JSON is configured, use it. Otherwise fall
        # back to a structurally valid placeholder: the plugin only needs the file
        # to parse and to contain a client entry whose package_name matches
        # applicationId (tech.focko.flicko). Push notifications won't work against
        # a placeholder, but main.dart already wraps Firebase.initializeApp() in
        # try/catch ("Firebase init skipped"), so the app still launches — which is
        # all app_launch_test.dart exercises.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          target="android/app/google-services.json"
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$target"
            echo "Wrote google-services.json from ANDROID_GOOGLE_SERVICES_JSON secret."
          else
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON secret is not set; using a placeholder google-services.json. Firebase/FCM will be inert in this run."
            cat > "$target" <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "flicko-ci-placeholder",
              "storage_bucket": "flicko-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "tech.focko.flicko"
                  }
                },
                "api_key": [
                  { "current_key": "AIzaSyA0000000000000000000000000000000000" }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi
          # Fail loudly here rather than 2.5 minutes into a Gradle build.
          python3 -c "import json,sys; json.load(open('$target'))"
          echo "google-services.json is present and parses as JSON."

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli 3.11.0

      - name: Run Patrol E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || '30' }}
          arch: x86_64
          profile: pixel_5
          working-directory: mobile
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            export PATH="$PATH:$HOME/.pub-cache/bin"
            patrol test --no-check-compatibility \
              -t integration_test/app_launch_test.dart \
              --dart-define=FLICKO_SUPABASE_URL=${{ secrets.E2E_SUPABASE_URL || 'https://flicko-test.supabase.co' }} \
              --dart-define=FLICKO_SUPABASE_ANON_KEY=${{ secrets.E2E_SUPABASE_ANON_KEY || 'dummy_anon_key' }} \
              --dart-define=FLICKO_API_BASE_URL=${{ secrets.E2E_API_BASE_URL || 'https://api.flicko.tech' }} \
              --dart-define=FLICKO_LIVEKIT_URL=${{ secrets.E2E_LIVEKIT_URL || 'wss://livekit.flicko.tech' }}
