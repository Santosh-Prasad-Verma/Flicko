name: Supabase CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'

jobs:
  supabase-lint:
    name: Supabase Lint & Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 'latest'

      - name: Start Supabase Local Development (Dry-runs migrations)
        # Starting the local environment automatically starts a Postgres container
        # and applies all local migrations, failing if there are SQL syntax errors.
        run: supabase start
        env:
          SUPABASE_AUTH_HOOK_SEND_EMAIL_SECRETS: 'v1,whsec_YmFzZTY0X2VuY29kZWRfc2VjcmV0X2Zvcl90ZXN0aW5nX2NpcGhlcg=='
          OPENAI_API_KEY: 'mock-openai-key'
          SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: 'mock-twilio-token'
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: 'mock-apple-secret'
          S3_HOST: 'mock-s3-host'
          S3_REGION: 'us-east-1'
          S3_ACCESS_KEY: 'mock-s3-access'
          S3_SECRET_KEY: 'mock-s3-secret'

      - name: Setup Deno
        # Deno is required for Supabase Edge Functions
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Lint Edge Functions
        # Lints TS/JS code inside the Deno edge functions directories
        run: deno lint supabase/functions/
