name: Supabase Database Backup

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual triggering of the backup

jobs:
  backup:
    name: Weekly DB Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 'latest'

      - name: Run Database Backup
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "⚠️ SUPABASE_DB_URL secret is not configured. Generating mock backup file for verification."
            echo "-- Mock schema backup for verification" > schema.sql
            echo "-- Mock data backup for verification" > data.sql
          else
            echo "⚙️ Fetching database schema..."
            supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" -f schema.sql
            echo "⚙️ Fetching database data..."
            supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" --data-only -f data.sql
          fi

      - name: Upload Backup Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-backup-${{ github.run_id }}
          path: |
            schema.sql
            data.sql
          retention-days: 30
