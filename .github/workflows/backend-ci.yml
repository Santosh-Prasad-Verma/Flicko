name: Backend & Microservices CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'services/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'services/**'

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test & Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24'

      - name: Test Go Backend
        run: |
          cd backend
          go mod tidy
          go test -short -v ./...

      - name: Test WS Gateway Microservice
        run: |
          cd services/ws-gateway
          go mod tidy
          go test -short -v ./...

  build-and-deploy:
    name: Build Docker Images & Deploy to Azure
    needs: test-and-lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build Backend Docker Image (Local Validation)
        run: |
          docker build -t flicko-backend:${{ github.sha }} -f backend/Dockerfile backend/

      - name: Check Azure Deployment Credentials
        id: check-deploy
        env:
          HAS_CREDS: ${{ secrets.AZURE_CREDENTIALS != '' && secrets.AZURE_ACR_NAME != '' }}
        run: |
          if [ "$HAS_CREDS" = "true" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::AZURE_CREDENTIALS or AZURE_ACR_NAME secret is not configured. Built Docker image successfully (VPS deployment is managed by azure-vps-deploy.yml)."
          fi

      - name: Azure Login
        if: steps.check-deploy.outputs.can_deploy == 'true'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Container Registry (ACR)
        id: check-acr
        if: steps.check-deploy.outputs.can_deploy == 'true'
        run: |
          if az acr show --name "${{ secrets.AZURE_ACR_NAME }}" >/dev/null 2>&1; then
            echo "acr_exists=true" >> "$GITHUB_OUTPUT"
            echo "ACR '${{ secrets.AZURE_ACR_NAME }}' verified in Azure subscription."
          else
            echo "acr_exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::Azure Container Registry '${{ secrets.AZURE_ACR_NAME }}' not found in active subscription. Skipping ACR push & Container Apps deploy (VPS deployment runs via azure-vps-deploy.yml)."
          fi

      - name: Log in to Azure Container Registry (ACR)
        if: steps.check-deploy.outputs.can_deploy == 'true' && steps.check-acr.outputs.acr_exists == 'true'
        run: |
          az acr login --name "${{ secrets.AZURE_ACR_NAME }}"

      - name: Push Backend Container to ACR
        if: steps.check-deploy.outputs.can_deploy == 'true' && steps.check-acr.outputs.acr_exists == 'true'
        run: |
          docker tag flicko-backend:${{ github.sha }} ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/flicko-backend:${{ github.sha }}
          docker tag flicko-backend:${{ github.sha }} ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/flicko-backend:latest
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/flicko-backend:${{ github.sha }}
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/flicko-backend:latest

      - name: Deploy Backend to Azure Container Apps
        if: steps.check-deploy.outputs.can_deploy == 'true' && steps.check-acr.outputs.acr_exists == 'true'
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703
        with:
          acrName: ${{ secrets.AZURE_ACR_NAME }}
          containerAppName: flicko-backend-app
          resourceGroup: flicko-rg
          imageToDeploy: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/flicko-backend:${{ github.sha }}
