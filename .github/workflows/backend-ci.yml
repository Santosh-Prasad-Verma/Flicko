name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache-dependency-path: "**/*.sum"

    - name: Verify Dependencies
      run: |
        for dir in backend mail-gateway services/shared services/ws-gateway services/msg-service; do
          if [ -d "$dir" ]; then
            (cd $dir && go mod verify)
          fi
        done

    - name: Go Vet & Lint
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        for dir in backend mail-gateway services/shared services/ws-gateway services/msg-service; do
          if [ -d "$dir" ]; then
            (cd $dir && go vet ./... && staticcheck ./...)
          fi
        done

    - name: Run Tests
      # Ensures all unit tests pass. Does not run DB-heavy integration tests unless mocked.
      run: |
        for dir in backend mail-gateway services/shared services/ws-gateway services/msg-service; do
          if [ -d "$dir" ]; then
            (cd $dir && go test -v ./... -coverprofile=coverage.txt)
          fi
        done
