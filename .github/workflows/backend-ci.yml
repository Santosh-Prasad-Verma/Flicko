name: Backend & Microservices CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'services/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'services/**'

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test & Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25'

      - name: Test Go Backend
        run: |
          cd backend
          go mod tidy
          go test -short -v ./...

      - name: Test WS Gateway Microservice
        run: |
          cd services/ws-gateway
          go mod tidy
          go test -short -v ./...

  build-and-deploy:
    name: Build Docker Images & Deploy to Azure
    needs: test-and-lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@15c4aadf093404726ab2ff205b2cdd33fa6d054c
        with:
          login-server: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and Push Backend Container
        run: |
          docker build -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/flicko-backend:${{ github.sha }} -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/flicko-backend:latest -f backend/Dockerfile backend/
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/flicko-backend:${{ github.sha }}
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/flicko-backend:latest

      - name: Azure Login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend to Azure Container Apps
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703
        with:
          appSource: backend/
          acrName: ${{ secrets.AZURE_ACR_NAME }}
          containerAppName: flicko-backend-app
          resourceGroup: flicko-rg
          imageToDeploy: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/flicko-backend:${{ github.sha }}
