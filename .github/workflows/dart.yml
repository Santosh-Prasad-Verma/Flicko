name: Dart & Flutter CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'mobile/**'

permissions:
  contents: read

jobs:
  build:
    name: Dart & Flutter Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          channel: stable
          cache: true

      - name: Setup environment
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsqlite3-dev sqlite3

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit tests
        run: |
          for i in 1 2 3; do
            if flutter test; then
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "flutter test failed, retrying in 5 seconds (attempt $i/3)..."
              sleep 5
            else
              echo "flutter test failed after 3 attempts."
              exit 1
            fi
          done
