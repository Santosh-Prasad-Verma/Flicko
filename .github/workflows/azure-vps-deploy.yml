name: Deploy to Azure VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'mail-gateway/**'
      - 'services/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'
      - '.env.prod'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Azure VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check Deployment Method
        id: check-method
        env:
          HAS_AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS != '' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ "$HAS_AZURE_CREDS" = "true" ]; then
            echo "method=azure" >> "$GITHUB_OUTPUT"
            echo "Deployment method: Azure CLI RunCommand (Native Agent)"
          elif echo "$SSH_KEY" | grep -q -- "-----BEGIN"; then
            echo "method=ssh" >> "$GITHUB_OUTPUT"
            echo "Deployment method: SSH Key"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::warning ::Neither AZURE_CREDENTIALS nor a valid PEM-formatted VPS_SSH_KEY is configured. Skipping automated deployment."
          fi

      - name: Azure Login
        if: steps.check-method.outputs.method == 'azure'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure VM via Azure CLI
        if: steps.check-method.outputs.method == 'azure'
        run: |
          echo "=== Deploying to Azure VM via RunCommand ==="
          az vm run-command invoke \
            --resource-group "${{ secrets.AZURE_VM_RG || 'FLICKO' }}" \
            --name "${{ secrets.AZURE_VM_NAME || 'Flicko-Server' }}" \
            --command-id RunShellScript \
            --scripts "
              export HOME=/home/Tarun
              export USER=Tarun
              cd /home/Tarun/Flicko || cd ~/Flicko
              git config --global --add safe.directory /home/Tarun/Flicko
              git fetch origin main
              git reset --hard origin/main
              docker compose -f docker-compose.prod.yml up -d --build
              docker compose -f docker-compose.prod.yml ps
            "

      - name: Deploy via SSH
        if: steps.check-method.outputs.method == 'ssh'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          DB_PASS: ${{ secrets.AZURE_POSTGRES_PASSWORD }}
          DB_HOST: ${{ secrets.AZURE_POSTGRES_HOST }}
          DB_USER: ${{ secrets.AZURE_POSTGRES_USER }}
          DB_NAME: ${{ secrets.AZURE_POSTGRES_DB }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 30s
          command_timeout: 10m
          envs: DB_PASS,DB_HOST,DB_USER,DB_NAME
          script: |
            set -euo pipefail
            echo "=== Starting Flicko Deployment ==="

            # Navigate to project directory
            cd ~/Flicko || cd /home/$USER/Flicko

            # Pull latest code
            echo "--- Pulling latest code from origin/main ---"
            git fetch origin main
            git reset --hard origin/main

            # Apply any pending database migrations if DB credentials are provided
            if [ -n "${DB_PASS:-}" ] && [ -n "${DB_HOST:-}" ] && [ -n "${DB_USER:-}" ] && [ -f backend/migrations/082_email_verification.up.sql ]; then
              echo "--- Applying migration 082_email_verification ---"
              PGPASSWORD="${DB_PASS}" psql \
                -h "${DB_HOST}" \
                -U "${DB_USER}" \
                -d "${DB_NAME:-postgres}" \
                -f backend/migrations/082_email_verification.up.sql \
                2>&1 || echo "Migration notice: check DB logs"
            fi

            # Rebuild and restart containers
            echo "--- Rebuilding Docker containers ---"
            docker compose -f docker-compose.prod.yml up -d --build

            # Health check
            echo "--- Running health checks ---"
            docker compose -f docker-compose.prod.yml ps

            echo "=== Flicko Deployment Complete ==="
