# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.

name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 16 * * 6'

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: go
          build-mode: autobuild
        - language: javascript-typescript
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        # NOTE: swift is intentionally excluded — no Podfile exists in ios/
        # so the build produces nothing for CodeQL to analyze.
        # Re-add when iOS/CocoaPods support is properly set up.

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java (java-kotlin)
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Flutter (Java-Kotlin)
      if: matrix.language == 'java-kotlin'
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps (Java/Kotlin)
      if: matrix.build-mode == 'manual' && matrix.language == 'java-kotlin'
      env:
        GRADLE_OPTS: >-
          -Dorg.gradle.jvmargs=-Xmx6144m
          -XX:MaxMetaspaceSize=1024m
          -Dfile.encoding=UTF-8
          -Dorg.gradle.daemon=false
        _JAVA_OPTIONS: "-Xmx6144m"
      shell: bash
      run: |
        cd mobile
        touch .env
        mkdir -p android/app
        if [ ! -f android/app/google-services.json ]; then
          cat > android/app/google-services.json <<'JSON'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "flicko-ci-placeholder",
            "storage_bucket": "flicko-ci-placeholder.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {
                  "package_name": "tech.focko.flicko"
                }
              },
              "api_key": [
                { "current_key": "dummy_api_key_for_ci_build" }
              ]
            }
          ],
          "configuration_version": "1"
        }
        JSON
        fi
        flutter pub get
        flutter build apk --debug --android-skip-build-dependency-validation

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
