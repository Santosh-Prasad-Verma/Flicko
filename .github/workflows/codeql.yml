# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.

name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 16 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: go
          build-mode: autobuild
        - language: javascript-typescript
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: swift
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java (java-kotlin)
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Flutter (Swift/Java-Kotlin)
      if: matrix.language == 'swift' || matrix.language == 'java-kotlin'
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps (Swift)
      if: matrix.build-mode == 'manual' && matrix.language == 'swift'
      shell: bash
      run: |
        cd mobile
        flutter pub get
        flutter build macos --debug

    - name: Run manual build steps (Java/Kotlin)
      if: matrix.build-mode == 'manual' && matrix.language == 'java-kotlin'
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
        _JAVA_OPTIONS: "-Xmx4096m"
      shell: bash
      run: |
        cd mobile
        flutter pub get
        flutter build apk --debug

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
