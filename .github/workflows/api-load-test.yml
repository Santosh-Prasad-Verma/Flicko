name: Automated API Performance & Load Testing

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API Gateway URL to run performance test against'
        required: true
        default: 'https://flicko.southeastasia.cloudapp.azure.com'

jobs:
  load-test:
    name: Execute Load Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup k6 Load Testing CLI
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        run: |
          k6 run scripts/k6-load-test.js
        env:
          API_TARGET_URL: ${{ github.event.inputs.target_url || 'https://flicko.southeastasia.cloudapp.azure.com' }}

  realtime-ws-test:
    name: Realtime WebSocket Fan-out Load Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup k6 Load Testing CLI
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Realtime WebSocket Test
        run: |
          k6 run scripts/k6-realtime-ws-test.js
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://flicko.southeastasia.cloudapp.azure.com' }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
