name: Flutter Mobile CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'

permissions:
  contents: read

jobs:
  analyze-and-build:
    name: Flutter Analyze & Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Environment & Config
        run: |
          cd mobile
          touch .env
          mkdir -p android/app
          if [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "flicko-ci-placeholder",
              "storage_bucket": "flicko-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "tech.focko.flicko"
                  }
                },
                "api_key": [
                  { "current_key": "dummy_api_key_for_ci_build" }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          cd mobile
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flicko-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
