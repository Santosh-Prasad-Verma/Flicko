name: Flutter Mobile CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'

permissions:
  contents: read

jobs:
  analyze-and-build:
    name: Flutter Analyze & Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Environment & Config
        run: |
          cd mobile
          touch .env
          mkdir -p android/app
          if [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "flicko-ci-placeholder",
              "storage_bucket": "flicko-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "tech.focko.flicko"
                  }
                },
                "api_key": [
                  { "current_key": "dummy_api_key_for_ci_build" }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          cd mobile
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Release APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx6144m
            -XX:MaxMetaspaceSize=1024m
            -Dfile.encoding=UTF-8
            -Dorg.gradle.daemon=false
          _JAVA_OPTIONS: "-Xmx6144m"
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation --target-platform android-arm64

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flicko-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
