name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'services/**'
      - 'mail-gateway/**'
      - 'nginx/**'
      - 'docker-compose.prod.yml'

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Secrets from Doppler
        run: doppler secrets download --no-file --format env > .env.production
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Copy .env to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: '.env.production'
          target: '~/Flicko/'

      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ ! -d "$HOME/Flicko/.git" ]; then
              echo "Repository not found on VPS. Cloning..."
              rm -rf ~/Flicko || true
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} ~/Flicko
            fi

            cd ~/Flicko || exit 1
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
            git reset --hard HEAD
            git pull origin main
            git remote set-url origin https://github.com/${{ github.repository }}

            mv ~/Flicko/.env.production ~/Flicko/.env

            mkdir -p ./secrets

            # Materialize JWT public key
            JWT_PUBLIC_KEY_LINE=$(grep -m 1 -E '^JWT_PUBLIC_KEY=' ~/Flicko/.env || true)
            if [ -n "$JWT_PUBLIC_KEY_LINE" ]; then
              JWT_PUBLIC_KEY_VALUE=${JWT_PUBLIC_KEY_LINE#JWT_PUBLIC_KEY=}
              JWT_PUBLIC_KEY_VALUE=$(printf '%s' "$JWT_PUBLIC_KEY_VALUE" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
              if [ -n "$JWT_PUBLIC_KEY_VALUE" ]; then
                rm -f ./secrets/jwt_public.pem
                printf '%b' "$JWT_PUBLIC_KEY_VALUE" > ./secrets/jwt_public.pem
              fi
            fi

            chmod +x scripts/generate-jwt-keys.sh
            if [ ! -f ./secrets/jwt_private.pem ]; then
              ./scripts/generate-jwt-keys.sh
            fi

            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build

            echo "Deployment successful. Checking container health..."
            sleep 15
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
