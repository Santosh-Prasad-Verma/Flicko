name: Deploy Flicko to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'services/**'
      - 'mail-gateway/**'
      - 'nginx/**'
      - 'docker-compose.prod.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_RESOURCE_GROUP: 'Flicko'
  AZURE_NSG_NAME: 'Flicko-Server-nsg'
  AZURE_RULE_NAME: 'SSH'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Whitelist Runner IP in Azure NSG
        id: nsg-ip
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "runner_ip=$RUNNER_IP" >> $GITHUB_OUTPUT
          
          ORIGINAL_IP=$(az network nsg rule show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --nsg-name ${{ env.AZURE_NSG_NAME }} \
            --name ${{ env.AZURE_RULE_NAME }} \
            --query "sourceAddressPrefix" -o tsv)
          echo "orig_ip=$ORIGINAL_IP" >> $GITHUB_OUTPUT
          
          echo "Whitelisting runner IP: $RUNNER_IP (original IP: $ORIGINAL_IP)"
          az network nsg rule update \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --nsg-name ${{ env.AZURE_NSG_NAME }} \
            --name ${{ env.AZURE_RULE_NAME }} \
            --source-address-prefixes "$RUNNER_IP"

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Secrets from Doppler
        run: doppler secrets download --no-file --format env > .env.production
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Copy .env to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: '.env.production'
          target: '~/Flicko/'

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Clone repository if missing or empty, otherwise pull
            if [ ! -d "$HOME/Flicko/.git" ]; then
              echo "Git repository missing. Cloning directly..."
              rm -rf ~/Flicko || true
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} ~/Flicko
            fi

            cd ~/Flicko || exit 1

            # 2. Pull the latest code
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
            git reset --hard HEAD
            git pull origin main

            # 2.5. Remove token from persisted git config (security hygiene)
            git remote set-url origin https://github.com/${{ github.repository }}

            # 3. Move the Doppler-generated .env file into place
            mv ~/Flicko/.env.production ~/Flicko/.env

            # 3.5. Materialize JWT public key file for docker compose secret mount
            # Ensure the secrets directory exists
            mkdir -p ./secrets

                        # Extract JWT_PUBLIC_KEY from the .env file if it exists,
            # and convert escaped newlines into real PEM line breaks.
            JWT_PUBLIC_KEY_LINE=$(grep -m 1 -E '^JWT_PUBLIC_KEY=' ~/Flicko/.env || true)
            if [ -n "$JWT_PUBLIC_KEY_LINE" ]; then
              JWT_PUBLIC_KEY_VALUE=${JWT_PUBLIC_KEY_LINE#JWT_PUBLIC_KEY=}
              JWT_PUBLIC_KEY_VALUE=$(printf '%s' "$JWT_PUBLIC_KEY_VALUE" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
              if [ -n "$JWT_PUBLIC_KEY_VALUE" ]; then
                rm -f ./secrets/jwt_public.pem
                printf '%b' "$JWT_PUBLIC_KEY_VALUE" > ./secrets/jwt_public.pem
              fi
            else
              echo "Note: JWT_PUBLIC_KEY is not in .env, falling back to local script."
            fi
            # Ensure JWT keys are generated (as a fallback/rotation mechanism)
            chmod +x scripts/generate-jwt-keys.sh
            if [ ! -f ./secrets/jwt_private.pem ]; then
              ./scripts/generate-jwt-keys.sh
            else
              echo "JWT keys already exist. Skipping payload generation."
            fi

            # 4. Build and restart the containers using Docker Compose
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build

            # 5. Wait and print logs for any unhealthy containers
            sleep 20
            for svc in nginx backend ws-gateway msg-service mail-gateway; do
              # We use the container name as defined in docker-compose.prod.yml
              container_name="flicko-$svc"
              status=$(docker inspect --format='{{.State.Health.Status}}' $container_name 2>/dev/null || echo "missing")
              echo "$svc health: $status"
              if [ "$status" != "healthy" ]; then
                echo "=== $svc logs ==="
                docker logs --tail=50 $container_name 2>&1 || true
              fi
            done

      - name: Restore Original SSH Rule in Azure NSG
        if: always()
        run: |
          echo "Restoring original NSG IP: ${{ steps.nsg-ip.outputs.orig_ip }}"
          az network nsg rule update \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --nsg-name ${{ env.AZURE_NSG_NAME }} \
            --name ${{ env.AZURE_RULE_NAME }} \
            --source-address-prefixes "${{ steps.nsg-ip.outputs.orig_ip }}"
