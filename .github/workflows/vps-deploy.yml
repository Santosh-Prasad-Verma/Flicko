name: Deploy Flicko to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'services/**'
      - 'docker-compose.prod.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Clone repository if missing or empty, otherwise pull
            if [ ! -d "$HOME/Flicko/.git" ]; then
              echo "Git repository missing. Cloning directly..."
              rm -rf ~/Flicko || true
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} ~/Flicko
            fi
            
            cd ~/Flicko || exit 1
            
            # 2. Pull the latest code
            git reset --hard HEAD
            git pull origin main
            
            # 3. Create or update the .env file with your production secrets
            cat << ENVFILE > .env
            REDIS_URL=${{ secrets.PROD_REDIS_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            ENVIRONMENT=production
            ENVFILE
            
            # Ensure JWT keys are generated
            chmod +x scripts/generate-jwt-keys.sh
            ./scripts/generate-jwt-keys.sh

            # 4. Build and restart the containers using Docker Compose
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build
