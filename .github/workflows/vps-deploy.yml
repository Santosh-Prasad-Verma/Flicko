name: Deploy Flicko to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'services/**'
      - 'docker-compose.prod.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Secrets from Doppler
        run: doppler secrets download --no-file --format docker > .env.production
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Copy .env to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".env.production"
          target: "~/Flicko/"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Clone repository if missing or empty, otherwise pull
            if [ ! -d "$HOME/Flicko/.git" ]; then
              echo "Git repository missing. Cloning directly..."
              rm -rf ~/Flicko || true
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} ~/Flicko
            fi
            
            cd ~/Flicko || exit 1
            
            # 2. Pull the latest code
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
            git reset --hard HEAD
            git pull origin main

            # 3. Move the Doppler-generated .env file into place
            mv ~/Flicko/.env.production ~/Flicko/.env

            # 3.5. Materialize JWT public key file for docker compose secret mount
            # Ensure the secrets directory exists
            mkdir -p ./secrets
            
            # Extract JWT_PUBLIC_KEY from the .env file and save it to a pem file
            # grep looks for the key, sed strips the 'JWT_PUBLIC_KEY=' part and any surrounding quotes
            grep -E "^JWT_PUBLIC_KEY=" ~/Flicko/.env | sed -E 's/^JWT_PUBLIC_KEY=["'\'']?(.*)["'\'']?$/\1/' > ./secrets/jwt_public.pem
             
            # Ensure JWT keys are generated (as a fallback/rotation mechanism)
            chmod +x scripts/generate-jwt-keys.sh
            ./scripts/generate-jwt-keys.sh

            # 4. Build and restart the containers using Docker Compose
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build
