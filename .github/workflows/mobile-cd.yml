name: Mobile Flutter Build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/**' # Only trigger if mobile code changed

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos

  build-android:
    name: Build Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Create .env file
        working-directory: ./mobile
        run: |
          echo "FLICKO_SUPABASE_URL=${{ secrets.FLICKO_SUPABASE_URL }}" >> .env
          echo "FLICKO_SUPABASE_ANON_KEY=${{ secrets.FLICKO_SUPABASE_ANON_KEY }}" >> .env
          echo "FLICKO_LIVEKIT_URL=${{ secrets.FLICKO_LIVEKIT_URL }}" >> .env
          echo "FLICKO_GIPHY_API_KEY=${{ secrets.FLICKO_GIPHY_API_KEY }}" >> .env
          echo "FLICKO_APPWRITE_PROJECT_ID=${{ secrets.FLICKO_APPWRITE_PROJECT_ID }}" >> .env
          echo "FLICKO_APPWRITE_PUBLIC_ENDPOINT=${{ secrets.FLICKO_APPWRITE_PUBLIC_ENDPOINT }}" >> .env
          echo "FLICKO_APPWRITE_BUCKET_ID=${{ secrets.FLICKO_APPWRITE_BUCKET_ID }}" >> .env

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flicko-android-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-ios:
    name: Build iOS (no codesign)
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Create .env file
        working-directory: ./mobile
        run: |
          echo "FLICKO_SUPABASE_URL=${{ secrets.FLICKO_SUPABASE_URL }}" >> .env
          echo "FLICKO_SUPABASE_ANON_KEY=${{ secrets.FLICKO_SUPABASE_ANON_KEY }}" >> .env
          echo "FLICKO_LIVEKIT_URL=${{ secrets.FLICKO_LIVEKIT_URL }}" >> .env
          echo "FLICKO_GIPHY_API_KEY=${{ secrets.FLICKO_GIPHY_API_KEY }}" >> .env
          echo "FLICKO_APPWRITE_PROJECT_ID=${{ secrets.FLICKO_APPWRITE_PROJECT_ID }}" >> .env
          echo "FLICKO_APPWRITE_PUBLIC_ENDPOINT=${{ secrets.FLICKO_APPWRITE_PUBLIC_ENDPOINT }}" >> .env
          echo "FLICKO_APPWRITE_BUCKET_ID=${{ secrets.FLICKO_APPWRITE_BUCKET_ID }}" >> .env

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: ./mobile
        run: flutter build ios --release --no-codesign
