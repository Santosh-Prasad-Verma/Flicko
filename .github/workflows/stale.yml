# This workflow warns and then closes issues and PRs that have had no activity of a specified amount of time.
#
# You can adjust the actions by modifying this file. See
# https://github.com/actions/stale for more information.
#
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue is stale because it has been open 60 days with no activity. Remove stale label or comment or this will be closed in 7 days.'
        stale-pr-message: 'This PR is stale because it has been open 60 days with no activity. Remove stale label or comment or this will be closed in 7 days.'
        stale-issue-label: 'stale'
        stale-pr-label: 'stale'
        exempt-issue-labels: 'pinned,security,enhancement'
        exempt-pr-labels: 'pinned,security'
        days-before-stale: 60
        days-before-close: 7
