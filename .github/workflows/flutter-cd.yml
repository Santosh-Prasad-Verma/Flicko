name: Flutter CD

on:
  push:
    tags:
      - 'v*' # Trigger build on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    name: Build & Distribute Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Create Mock Env File
        run: touch .env

      - name: Set up Java
        uses: actions/setup-java@8df10395cd63871d25c7e4014b378c6152b0ab1d
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@44ae065c9134ba3373840e73b0c23b338fa75097
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install Dependencies
        run: flutter pub get

      # Setup Android Keystore for Signing
      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      # Build Release Binaries
      - name: Build Release APK
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=FLICKO_API_URL="$PROD_API_URL"

      # Build Release App Bundle (AAB)
      - name: Build Release App Bundle (AAB)
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --dart-define=FLICKO_API_URL="$PROD_API_URL"

      # Distribute Android Build to Firebase App Distribution (Beta testers)
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Activity@b673ab1a3f65057b545d94fcbe65e2365cfd37e5
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          groups: testers
          file: mobile/build/app/outputs/flutter-apk/app-release.apk

      # Optionally upload the AAB to Google Play Console
      - name: Upload to Google Play
        uses: r0adkfv/upload-google-play@cbd019671cf2b4d9fae155452d3a39e802ee6c29
        with:
          serviceAccountJsonRaw: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.flicko.app
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal # Play Store internal track

  build-ios:
    name: Build & Distribute iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Create Mock Env File
        run: touch .env

      - name: Set up Flutter
        uses: subosito/flutter-action@44ae065c9134ba3373840e73b0c23b338fa75097
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Install Apple Certificates and Provisioning Profiles
      - name: Install Apple Certificate and Provisioning Profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          # Create and configure temporary keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          # Decode and import distribution certificate
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          # Decode and install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # Build iOS IPA
      - name: Build iOS IPA
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist \
            --dart-define=FLICKO_API_URL="$PROD_API_URL"

      # Distribute iOS Build to TestFlight
      - name: Upload to Apple TestFlight
        uses: Apple-Actions/upload-testflight-build@448c5e64883f3e9c20a9a957a627fe55fa91aebe
        with:
          app-path: mobile/build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
