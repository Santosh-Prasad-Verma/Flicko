name: Frontend CI

on:
  push:
    branches: ['main']
    paths:
      - 'Flicko-Web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'Flicko-Web/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Flicko-Web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Flicko-Web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Eslint
        run: npm run lint

      - name: Run Tests
        run: npm run test:run

      - name: Run Production Build
        run: npm run build
