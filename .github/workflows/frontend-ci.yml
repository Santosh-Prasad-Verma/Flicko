name: Frontend CI

on:
  push:
    branches: ['main']
    paths:
      - 'Flicko-Web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'Flicko-Web/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Flicko-Web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('Flicko-Web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Run Eslint
        run: npm run lint

      - name: Run Tests
        run: npm run test:run

      - name: Run Production Build
        run: npm run build
