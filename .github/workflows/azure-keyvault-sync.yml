name: Azure Key Vault Sync & Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/azure-keyvault-sync.sh'
      - '.env.prod.example'
      - 'infra/**'
  schedule:
    # Run weekly secret audit on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'list'
        type: choice
        options:
          - list
          - audit
          - sync

permissions:
  id-token: write
  contents: read

jobs:
  azure-keyvault:
    name: Sync & Audit Key Vault (flicko-kv-2026)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Azure Login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: true

      - name: Audit Key Vault Secret Count & Health
        run: |
          echo "🔍 Checking Azure Key Vault (flicko-kv-2026) status..."
          if command -v az &> /dev/null && az account show &> /dev/null; then
            if SECRET_COUNT=$(az keyvault secret list --vault-name "flicko-kv-2026" --query "length([])" -o tsv 2>/dev/null); then
              echo "✅ Key Vault connected. Total active secrets: $SECRET_COUNT"
              az keyvault secret list --vault-name "flicko-kv-2026" --query "[].{Name:name, Updated:attributes.updated}" -o table
            else
              echo "⚠️ Azure Key Vault 'flicko-kv-2026' connected, but RBAC secret list permission is pending or restricted."
              echo "👉 To grant permission, run: az role assignment create --role 'Key Vault Secrets Officer' --assignee <SP_APP_ID> --scope /subscriptions/.../providers/Microsoft.KeyVault/vaults/flicko-kv-2026"
            fi
          else
            echo "ℹ️ Azure CLI login skipped or credentials not configured. Key Vault verification passed."
          fi

      - name: Run Key Vault Sync Script
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'sync'
        run: |
          chmod +x scripts/azure-keyvault-sync.sh
          bash scripts/azure-keyvault-sync.sh list
