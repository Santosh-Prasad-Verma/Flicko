name: GolangCI-Lint

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/golangci-lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/golangci-lint.yml'

permissions:
  contents: read

jobs:
  golangci:
    name: Lint Go Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: 'backend/go.sum'

      - name: Run golangci-lint
        run: |
          cd backend
          go mod tidy
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5 run --timeout=5m ./...
