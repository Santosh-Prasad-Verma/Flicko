# =============================================================================
# Flicko — Prometheus Alert Rules
# =============================================================================
# All alerts from Production-Architecture.md §10.3 plus supplementary rules
# for CPU usage and container restart detection.
#
# Mounted into prometheus container alongside prometheus.yml.
# =============================================================================

groups:
  # ── Critical alerts (page-worthy) ─────────────────────────────────────────
  - name: flicko_critical
    rules:
      - alert: HighMemoryUsage
        expr: >
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Memory usage above 90%"
          description: "Host memory usage is {{ $value | humanizePercentage }} for the last 5 minutes."

      - alert: WSGatewayDown
        expr: up{job="ws-gateway"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "WS Gateway is down"
          description: "Prometheus cannot scrape ws-gateway for 30s. Immediate investigation required."

      - alert: HighErrorRate
        expr: >
          sum(rate(flicko_http_request_duration_seconds_count{status=~"5.."}[5m]))
          / sum(rate(flicko_http_request_duration_seconds_count[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP error rate above 1%"
          description: "5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: DiskSpaceLow
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/"}
          / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space below 15%"
          description: "Root filesystem has only {{ $value | humanizePercentage }} free."

  # ── Warning alerts (investigate soon) ─────────────────────────────────────
  - name: flicko_warnings
    rules:
      - alert: HighWSConnections
        expr: flicko_ws_active_connections > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WS connections approaching limit ({{ $value }})"
          description: "Active WebSocket connections have been above 5000 for 5 minutes."

      - alert: HighMessageLatency
        expr: >
          histogram_quantile(0.95,
            rate(flicko_ws_message_latency_seconds_bucket[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 message latency above 500ms"
          description: "95th percentile message delivery latency is {{ $value }}s."

      - alert: SlowConsumerRate
        expr: rate(flicko_ws_slow_consumer_disconnects_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High slow consumer disconnect rate"
          description: "Slow consumer disconnects are happening at {{ $value }}/sec."

      - alert: PubSubDrops
        expr: rate(flicko_pubsub_messages_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis Pub/Sub messages being dropped"
          description: "Messages are being dropped due to backpressure at {{ $value }}/sec."

      # RedisMemoryHigh — Removed (using Upstash cloud, monitor via dashboard)

      - alert: DBPoolExhaustion
        expr: flicko_db_pool_active_connections / 20 > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB connection pool above 80%"
          description: "Database pool utilization is {{ $value | humanizePercentage }}."

      - alert: HighCPUUsage
        expr: >
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage above 85%"
          description: "Host CPU usage has been above 85% for 10 minutes."

      - alert: ContainerRestarting
        expr: >
          increase(container_restart_count[15m]) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container restarting frequently"
          description: "Container {{ $labels.name }} has restarted more than 3 times in 15 minutes."
