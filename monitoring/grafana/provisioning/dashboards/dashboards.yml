# =============================================================================
# Grafana — Dashboard Provider Configuration
# =============================================================================
# Auto-provisions dashboard JSON files from the dashboards directory.
# See: https://grafana.com/docs/grafana/latest/administration/provisioning/
# =============================================================================

apiVersion: 1

providers:
  - name: "Flicko"
    orgId: 1
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
