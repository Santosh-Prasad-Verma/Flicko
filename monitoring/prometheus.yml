# =============================================================================
# Flicko — Production Prometheus Configuration
# =============================================================================
# Scrapes all Flicko services + infrastructure exporters.
# Mounted into prometheus container at /etc/prometheus/prometheus.yml
# =============================================================================

global:
  scrape_interval: 15s          # Default for most targets
  evaluation_interval: 15s      # How often rules are evaluated
  scrape_timeout: 10s

  external_labels:
    cluster: "flicko-prod"
    environment: "production"

# ── Alert rule files ─────────────────────────────────────────────────────────
rule_files:
  - "alerts.yml"

# ── Scrape configs ───────────────────────────────────────────────────────────
scrape_configs:

  # ── WS Gateway (Go) — shorter interval for real-time connection tracking ──
  - job_name: "ws-gateway"
    scrape_interval: 10s
    static_configs:
      - targets: ["ws-gateway:9102"]
        labels:
          service: ws-gateway
          env: production

  # ── Message Service (Go) ──────────────────────────────────────────────────
  - job_name: "msg-service"
    scrape_interval: 10s
    static_configs:
      - targets: ["msg-service:9101"]
        labels:
          service: msg-service
          env: production

  # ── Backend Service (Go) ──────────────────────────────────────────────────
  - job_name: "backend"
    scrape_interval: 15s
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: backend
          env: production

  # ── Redis Exporter ───────────────────────────────────────────────────────
  - job_name: "redis"
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
          env: production

  # ── NGINX Exporter ───────────────────────────────────────────────────────
  - job_name: "nginx"
    scrape_interval: 15s
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: nginx
          env: production

  # ── Node Exporter (host metrics) ─────────────────────────────────────────
  - job_name: "node"
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node
          env: production

  # ── Storage — Using Cloudinary (cloud), no local storage to scrape

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9090"]
