# =============================================================================
# Flicko — Production Prometheus Configuration
# =============================================================================
# Scrapes all Flicko services + infrastructure exporters.
# Mounted into prometheus container at /etc/prometheus/prometheus.yml
# =============================================================================

global:
  scrape_interval: 15s          # Default for most targets
  evaluation_interval: 15s      # How often rules are evaluated
  scrape_timeout: 10s

  external_labels:
    cluster: "flicko-prod"
    environment: "production"

# ── Alert rule files ─────────────────────────────────────────────────────────
rule_files:
  - "alerts.yml"

remote_write:
  - url: "https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom/push"
    basic_auth:
      username: "3350230"
      password: "glc_eyJvIjoiMTgzNDIxMiIsIm4iOiJzdGFjay0xNzEzMDAzLWFsbG95LWZsaWNrby1zZXJ2ZXIiLCJrIjoiMXQ1cTQyNHhKUU5YcTFMYTZBTmNNMzExIiwibSI6eyJyIjoicHJvZC1hcC1zb3V0aC0xIn19"
    queue_config:
      max_samples_per_send: 1000
      batch_send_deadline: 5s
      max_shards: 3

# ── Scrape configs ───────────────────────────────────────────────────────────
scrape_configs:

  # ── WS Gateway (Go) — shorter interval for real-time connection tracking ──
  - job_name: "ws-gateway"
    scrape_interval: 10s
    static_configs:
      - targets: ["ws-gateway:9102"]
        labels:
          service: ws-gateway
          env: production

  # ── Message Service (Go) ──────────────────────────────────────────────────
  - job_name: "msg-service"
    scrape_interval: 10s
    static_configs:
      - targets: ["msg-service:9101"]
        labels:
          service: msg-service
          env: production

  # ── Redis Exporter ───────────────────────────────────────────────────────
  - job_name: "redis"
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
          env: production

  # ── NGINX Exporter ───────────────────────────────────────────────────────
  - job_name: "nginx"
    scrape_interval: 15s
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: nginx
          env: production

  # ── Node Exporter (host metrics) ─────────────────────────────────────────
  - job_name: "node"
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node
          env: production

  # ── Storage — Using Cloudinary (cloud), no local storage to scrape

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9090"]
