services:
  redis:
    image: redis:7-alpine
    container_name: livekit-redis-prod
    restart: unless-stopped
    ports:
      # Bind redis strictly to localhost for security, so it is not exposed publicly.
      # LiveKit (running in host network mode) can reach it at localhost:6379.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server-prod
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    # Host networking is required for high-performance WebRTC UDP media routing
    # and direct binding to TURN/WebRTC TCP ports without Docker bridge network overhead.
    network_mode: "host"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
      # Shared read-only volume to read SSL certificates provisioned by Caddy
      - caddy_data:/caddy_data:ro
    depends_on:
      - redis

  caddy:
    image: caddy:2-alpine
    container_name: livekit-caddy-prod
    restart: unless-stopped
    # Host networking allows Caddy to easily reverse proxy to localhost:7880
    network_mode: "host"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  redis_data:
